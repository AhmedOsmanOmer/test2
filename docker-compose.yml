services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: gp
      # تُقرأ من ملف .env (لا كلمة مرور ثابتة في الملف)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ضع POSTGRES_PASSWORD في ملف .env}
      POSTGRES_DB: gp_erp
    # متاحة من نفس الجهاز فقط
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
volumes:
  pgdata:
