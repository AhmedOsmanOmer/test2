# /etc/nginx/sites-available/gp-erp — وكيل عكسي مع HTTPS
# الشهادة: Let's Encrypt (certbot) للنطاق العام، أو شهادة داخلية للشبكة المحلية.
server {
    listen 80;
    server_name erp.example.sa;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name erp.example.sa;
    ssl_certificate     /etc/letsencrypt/live/erp.example.sa/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erp.example.sa/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 55m;    # = uploadMaxMb في src/lib/upload-limit.json + هامش لترويسات الطلب
    proxy_read_timeout 300s;

    # البث المباشر لشاشة الإنتاج: يجب تعطيل التخزين المؤقت
    location /api/live-board/stream {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    # المهام الدورية من الخادم نفسه فقط
    location /api/cron { allow 127.0.0.1; deny all; proxy_pass http://127.0.0.1:3000; }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # مهم: يستبدل أي قيمة يرسلها العميل لمنع تزوير IP في حماية محاولات الدخول
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
